name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tip kontrolü
        run: npx tsc

      - name: Lint
        run: npm run lint

      - name: Testler
        run: npm test

      - name: İçerik doğrulaması (frontmatter, kaynaklar)
        run: npx tsx scripts/check-content.ts

      - name: Ön koşul grafiği doğrulaması
        run: npx tsx scripts/validate-content-graph.ts

      # Taslak derslerin üretim çıktısına sızmadığını derleyerek doğrular.
      # docs/06-kalite-ve-topluluk.md Katman 3: insan gözden geçirmesinden
      # geçmemiş içerik herkese açık adreste bulunamaz. `npm run build`
      # sonunda scripts/check-no-draft-pages.ts zaten koşuyor; burada
      # derlemenin kendisi CI'ya bu amaçla eklendi.
      - name: Derleme + taslak sayfa sızıntısı kontrolü
        run: npm run build

      # docs/08-guvenlik-sertlestirme.md "Otomatik zafiyet taraması"
      # kuralı: yüksek/kritik zafiyet varsa build kırılır.
      - name: Bağımlılık güvenlik taraması
        run: npm audit --audit-level=high
