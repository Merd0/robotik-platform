name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # .nvmrc'deki pin gerçekten uygulandı mı? setup-node sessizce başka
      # bir sürüme düşerse (ör. node-version-file okunamazsa runner'ın
      # varsayılanı devreye girer) bunu fark etmenin yolu yok: package.json
      # engines alanı yalnızca uyarı üretir, build'i kırmaz. Bu adım
      # setup-node major yükseltmelerinde de sessiz regresyonu yakalar.
      - name: Node sürümü .nvmrc ile eşleşiyor mu
        run: |
          echo "Çalışan sürüm: $(node -v)"
          echo ".nvmrc: $(cat .nvmrc)"
          test "$(node -v | cut -d. -f1)" = "v$(tr -d '[:space:]' < .nvmrc)"

      - run: npm ci

      - name: Tip kontrolü
        run: npx tsc

      - name: Lint
        run: npm run lint

      - name: Testler
        run: npm test

      - name: İçerik doğrulaması (frontmatter, kaynaklar)
        run: npx tsx scripts/check-content.ts

      - name: Ön koşul grafiği doğrulaması
        run: npx tsx scripts/validate-content-graph.ts

      # Doğru cevap şık konumu dağılımı: içerikte %89 oranında 2. şıktaydı,
      # öğrenci soruyu okumadan yüksek puan alabiliyordu. Kararlı karıştırma
      # (lib/quiz.ts) devrede mi, bu kontrol doğruluyor.
      - name: Alıştırma şık dağılımı
        run: npx tsx scripts/check-quiz-dagilimi.ts

      # MDX AST allowlist: içerik yalnızca izinli bileşenleri ve saf veri
      # prop'larını kullanabilir. blockJS: false ayarının açtığı boşluğu
      # kapatır (bkz. docs/08-guvenlik-sertlestirme.md).
      - name: MDX güvenlik denetimi
        run: npx tsx scripts/check-mdx-guvenlik.ts

      # İnsan gözden geçirmesi 2026-08-10'da opsiyonele çevrildi (bkz.
      # docs/06-kalite-ve-topluluk.md "Katman 3"). Review kontrolü iki ayrı
      # kanala bölündü (Sprint 0, tek REVIEW_STRICT bayrağının 47 zararsız
      # legacy uyarısını da fatal yapıp CI'ı kilitleme riski vardı):
      #  - receipt-integrity: bir makbuzun TAHRİF edilip edilmediği (hash,
      #    şema, sourceCommit, rol, append-only). Bu HER ZAMAN fatal'dır.
      #  - review-coverage/source-migration: eksik makbuz, legacy kaynak
      #    borcu. Bu HER ZAMAN yalnız rapordur, build'i kırmaz.
      - name: Review kapsamı (bilgilendirici, kapı değil)
        run: npm run check-review-debt

      - name: Review makbuzu bütünlüğü (tahrifat varsa fatal)
        run: npm run check-review-integrity

      # Kaynak gizliliği (docs/00-vizyon.md mutlak kuralı) için kalıp taraması:
      # iş yeri/kurum/staj bağlamı ve kişisel ton sızmaları. İki üniversite
      # dersine bu tür bir cümle girip biri canlı siteye çıktığı için eklendi
      # (bkz. docs/08-guvenlik-sertlestirme.md bölüm 6).
      - name: İşyeri ve gizlilik terimleri denetimi
        run: npm run check-sensitive-terms

      # `durum: taslak` işaretli bir dersin üretim çıktısına sızmadığını
      # derleyerek doğrular. Kural artık insan incelemesine değil, yazarın
      # kendi "bu henüz hazır değil" işaretine dayanıyor: taslak diye
      # işaretlenen içerik herkese açık adreste bulunamaz. `npm run build`
      # sonunda scripts/check-no-draft-pages.ts zaten koşuyor; burada
      # derlemenin kendisi CI'ya bu amaçla eklendi.
      - name: Derleme + taslak sayfa sızıntısı kontrolü
        run: npm run build

      - name: Yüzey bazlı gzip/brotli performans bütçesi
        run: npm run check-performance-budget

      - name: Chromium kur
        run: npx playwright install --with-deps chromium

      - name: Üç viewport erişilebilirlik ve kullanıcı akışı
        run: npm run test:e2e

      # docs/08-guvenlik-sertlestirme.md "Otomatik zafiyet taraması"
      # kuralı: yüksek/kritik zafiyet varsa build kırılır.
      - name: Bağımlılık güvenlik taraması
        run: npm audit --audit-level=high
