name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Tip kontrolü
        run: npx tsc

      - name: Lint
        run: npm run lint

      - name: Testler
        run: npm test

      - name: İçerik doğrulaması (frontmatter, kaynaklar)
        run: npx tsx scripts/check-content.ts

      - name: Ön koşul grafiği doğrulaması
        run: npx tsx scripts/validate-content-graph.ts

      # Doğru cevap şık konumu dağılımı: içerikte %89 oranında 2. şıktaydı,
      # öğrenci soruyu okumadan yüksek puan alabiliyordu. Kararlı karıştırma
      # (lib/quiz.ts) devrede mi, bu kontrol doğruluyor.
      - name: Alıştırma şık dağılımı
        run: npx tsx scripts/check-quiz-dagilimi.ts

      # MDX AST allowlist: içerik yalnızca izinli bileşenleri ve saf veri
      # prop'larını kullanabilir. blockJS: false ayarının açtığı boşluğu
      # kapatır (bkz. docs/08-guvenlik-sertlestirme.md).
      - name: MDX güvenlik denetimi
        run: npx tsx scripts/check-mdx-guvenlik.ts

      # Taslak derslerin üretim çıktısına sızmadığını derleyerek doğrular.
      # docs/06-kalite-ve-topluluk.md Katman 3: insan gözden geçirmesinden
      # geçmemiş içerik herkese açık adreste bulunamaz. `npm run build`
      # sonunda scripts/check-no-draft-pages.ts zaten koşuyor; burada
      # derlemenin kendisi CI'ya bu amaçla eklendi.
      - name: Derleme + taslak sayfa sızıntısı kontrolü
        run: npm run build

      # docs/08-guvenlik-sertlestirme.md "Otomatik zafiyet taraması"
      # kuralı: yüksek/kritik zafiyet varsa build kırılır.
      - name: Bağımlılık güvenlik taraması
        run: npm audit --audit-level=high
